name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.isocalendar.svg
          
          # --- ESTETICĂ & VIBE ---
          config_timezone: Europe/Bucharest
          config_theme: tokyonight      # Sincronizare perfectă de culori (cyan/dark)
          config_transparent: yes       # Efect de floating, zero fundal pătrățos
          base: ""                      # Oprim statisticile clasice plictisitoare
          
          # --- ORAȘUL 3D ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year # Zoom masiv pe blocurile 3D
          
          # --- HABITS & FACTS ---
          plugin_habits: yes
          plugin_habits_from: 200       # Analizează ultimele 200 de commit-uri
          plugin_habits_days: 14        # Pe ultimele 14 zile
          plugin_habits_facts: yes      # Generează fapte (ex: "Active mostly during the night")
          plugin_habits_charts: yes     # Grafic dinamic de activitate orară
