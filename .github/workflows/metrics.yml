name: Metrics
on:
  # Se actualizează automat o dată la 24 de ore
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Numele fișierului care va fi generat
          filename: metrics.plugin.isocalendar.svg
          
          # Setări de bază
          config_timezone: Europe/Bucharest
          base: "" # Lăsăm gol ca să nu ne încarce cu statistici pe care le ai deja
          
          # Activarea Isocalendarului 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
